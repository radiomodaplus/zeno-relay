<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUTT Web Real-Time — Diseño Claro & Niveles</title>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <style>
    :root {
      --bg: #eef2f7;
      --panel: #ffffff;
      --box: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --green: #059669;
      --cyan: #0284c7;
      --red: #dc2626;
      --amber: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .butt-app {
      width: 100%;
      max-width: 740px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .top-status {
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .status-title { font-size: 0.7rem; color: var(--muted); font-weight: 800; text-transform: uppercase; }
    .status-endpoint { font-family: ui-monospace, monospace; font-size: 0.85rem; color: var(--cyan); font-weight: 700; word-break: break-all; }
    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 900;
      background: #e2e8f0;
      color: var(--muted);
      white-space: nowrap;
    }
    .badge.live {
      background: #fee2e2;
      color: var(--red);
      border: 1px solid #fca5a5;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .metric-card {
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .metric-card small { display: block; font-size: 0.62rem; color: var(--muted); font-weight: 800; }
    .metric-card strong { font-family: ui-monospace, monospace; font-size: 0.92rem; color: var(--text); }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 620px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--box);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h3 { font-size: 0.74rem; color: var(--cyan); text-transform: uppercase; letter-spacing: 0.4px; }
    label { display: block; font-size: 0.68rem; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
    input, select {
      width: 100%;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.82rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--cyan); }
    .row-inline { display: flex; gap: 6px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 0.78rem;
      cursor: pointer;
      color: #fff;
      background: #334155;
    }
    button:hover { filter: brightness(1.06); }
    .btn-pc { background: #0284c7; }
    .btn-pc.active { background: #059669; }
    .btn-stream {
      width: 100%;
      padding: 14px;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-radius: 10px;
    }
    .btn-stream.live {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
    }

    /* NIVELES DE EMISORA TIPO CONSOLA */
    .levels-panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .levels-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--muted);
    }
    .levels-header strong {
      font-family: ui-monospace, monospace;
      color: var(--text);
    }
    .meter-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .meter-tag {
      width: 22px;
      font-size: 0.72rem;
      font-weight: 900;
      color: var(--muted);
      text-align: center;
    }
    .vu-wrap {
      flex: 1;
      height: 14px;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      overflow: hidden;
    }
    .vu-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981 62%, #f59e0b 84%, #ef4444 100%);
      transition: width 0.05s linear;
    }
    .meter-pct {
      width: 44px;
      text-align: right;
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text);
    }
    .scope-canvas {
      width: 100%;
      height: 54px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      display: block;
    }

    .log-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: ui-monospace, monospace;
      font-size: 0.72rem;
      color: #0f172a;
      height: 88px;
      overflow-y: auto;
    }
    .vol-line { display: flex; align-items: center; gap: 8px; }
    .vol-line span { font-size: 0.7rem; width: 42px; text-align: right; font-family: ui-monospace, monospace; color: var(--text); }
  </style>
</head>
<body>
  <div class="butt-app">
    <div class="top-status">
      <div>
        <div class="status-title">BUTT STREAM — ICECAST / ZENO</div>
        <div class="status-endpoint" id="endpointLabel">link.zeno.fm:80/xksclgx3mfcuv</div>
      </div>
      <span class="badge" id="liveBadge">IDLE / OFF</span>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <small>TIEMPO AL AIRE</small>
        <strong id="timerText">00:00:00</strong>
      </div>
      <div class="metric-card">
        <small>DATOS ENVIADOS</small>
        <strong id="bytesText">0.0 KB</strong>
      </div>
      <div class="metric-card">
        <small>FORMATO</small>
        <strong id="codecText">MP3 128k</strong>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3>1. Servidor (Icecast)</h3>
        <div>
          <label>Dirección / Host</label>
          <input type="text" id="host" value="link.zeno.fm" oninput="saveCfg()">
        </div>
        <div class="row-inline">
          <div style="flex:1;">
            <label>Puerto</label>
            <input type="number" id="port" value="80" oninput="saveCfg()">
          </div>
          <div style="flex:2;">
            <label>Punto de montaje</label>
            <input type="text" id="mount" value="/xksclgx3mfcuv" oninput="saveCfg()">
          </div>
        </div>
        <div class="row-inline">
          <div style="flex:1;">
            <label>Usuario</label>
            <input type="text" id="user" value="source" oninput="saveCfg()">
          </div>
          <div style="flex:1;">
            <label>Bitrate</label>
            <select id="bitrate" onchange="saveCfg()">
              <option value="96">96 kbps</option>
              <option value="128" selected>128 kbps</option>
              <option value="192">192 kbps</option>
            </select>
          </div>
        </div>
        <div>
          <label>Contraseña</label>
          <input type="password" id="password" value="9xhKMMT4" placeholder="Contraseña de fuente" oninput="saveCfg()">
        </div>
      </div>

      <div class="card">
        <h3>2. Consola 2×1 y Audio del PC</h3>
        <div>
          <label>Entrada Consola / Cable 2×1 / Line-In</label>
          <div class="row-inline">
            <select id="inputDevice" onchange="switchConsoleInput()"></select>
            <button type="button" onclick="loadDevices()" title="Detectar entradas">↻</button>
          </div>
        </div>
        <div>
          <label>Ganancia Consola / Entrada</label>
          <div class="vol-line">
            <input type="range" id="consoleGainSlider" min="0" max="2" step="0.05" value="1" oninput="updateGains()">
            <span id="consoleGainVal">100%</span>
          </div>
        </div>
        <div>
          <label>Audio que suena en el PC (Pestaña / Sistema)</label>
          <div class="row-inline">
            <button type="button" class="btn-pc" id="btnCapturePc" onclick="togglePcSystemAudio()" style="flex:1;">
              💻 Capturar Audio del PC
            </button>
          </div>
        </div>
        <div>
          <label>Ganancia Audio del PC</label>
          <div class="vol-line">
            <input type="range" id="pcGainSlider" min="0" max="1.5" step="0.05" value="0.85" oninput="updateGains()">
            <span id="pcGainVal">85%</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:10px 12px;">
      <div class="row-inline">
        <input type="text" id="songTitle" placeholder="Título actual en vivo" value="Radio Moda - En Vivo">
        <button type="button" class="btn-pc" onclick="sendMetadata()">📡 Enviar Título</button>
      </div>
    </div>

    <!-- NIVELES DE EMISORA AL RECIBIR SONIDO -->
    <div class="levels-panel">
      <div class="levels-header">
        <span>NIVELES DE EMISORA (CONSOLA + PC)</span>
        <strong id="dbReadout">-∞ dB</strong>
      </div>
      <div class="meter-row">
        <span class="meter-tag">L</span>
        <div class="vu-wrap"><div class="vu-fill" id="vuLeft"></div></div>
        <span class="meter-pct" id="pctLeft">0%</span>
      </div>
      <div class="meter-row">
        <span class="meter-tag">R</span>
        <div class="vu-wrap"><div class="vu-fill" id="vuRight"></div></div>
        <span class="meter-pct" id="pctRight">0%</span>
      </div>
      <canvas id="waveCanvas" class="scope-canvas" width="680" height="54"></canvas>
    </div>

    <button type="button" class="btn-stream" id="btnStream" onclick="toggleStream()">
      ▶ CONECTAR Y TRANSMITIR
    </button>

    <div class="log-box" id="logBox">&gt; Datos de Zeno actualizados. Listo para iniciar.</div>
  </div>

  <script>
    const RELAY_URL = "wss://zeno-relay.onrender.com";

    const DEFAULT_CFG = {
      host: "link.zeno.fm",
      port: "80",
      mount: "/xksclgx3mfcuv",
      user: "source",
      password: "9xhKMMT4",
      bitrate: "128"
    };

    let isLive = false;
    let ws = null;
    let pingTimer = null;
    let authRetryTimer = null;
    let reconnectTimer = null;
    let timerInterval = null;
    let startTs = 0;
    let bytesSent = 0;

    let audioCtx = null;
    let masterGain = null;
    let consoleGain = null;
    let pcGain = null;
    let splitter = null;
    let analyserL = null;
    let analyserR = null;
    let waveAnalyser = null;
    let processor = null;
    let mp3Encoder = null;
    let levelAnimId = null;

    let consoleStream = null;
    let consoleSource = null;

    let pcCaptureStream = null;
    let pcCaptureSource = null;

    function writeLog(msg) {
      const box = document.getElementById('logBox');
      box.innerHTML += `<br>&gt; ${msg}`;
      box.scrollTop = box.scrollHeight;
    }

    function saveCfg() {
      ['host', 'port', 'mount', 'user', 'password', 'bitrate'].forEach(id => {
        const el = document.getElementById(id);
        if (el) localStorage.setItem('butt_v3_' + id, el.value);
      });
      const host = document.getElementById('host').value.trim() || DEFAULT_CFG.host;
      const port = document.getElementById('port').value.trim() || DEFAULT_CFG.port;
      let mount = document.getElementById('mount').value.trim() || DEFAULT_CFG.mount;
      if (!mount.startsWith('/')) mount = '/' + mount;
      const br = document.getElementById('bitrate').value;

      document.getElementById('endpointLabel').textContent = `${host}:${port}${mount}`;
      document.getElementById('codecText').textContent = `MP3 ${br}k`;
    }

    function updateGains() {
      const cVal = parseFloat(document.getElementById('consoleGainSlider').value || 1);
      const pVal = parseFloat(document.getElementById('pcGainSlider').value || 0.85);
      document.getElementById('consoleGainVal').textContent = `${Math.round(cVal * 100)}%`;
      document.getElementById('pcGainVal').textContent = `${Math.round(pVal * 100)}%`;
      if (consoleGain && audioCtx) consoleGain.gain.setTargetAtTime(cVal, audioCtx.currentTime, 0.05);
      if (pcGain && audioCtx) pcGain.gain.setTargetAtTime(pVal, audioCtx.currentTime, 0.05);
    }

    async function loadDevices() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const sel = document.getElementById('inputDevice');
        const saved = localStorage.getItem('butt_v3_input_dev') || '';
        sel.innerHTML = '<option value="">Entrada por defecto del sistema</option>';
        devices.filter(d => d.kind === 'audioinput').forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.text = d.label || `Entrada (${d.deviceId.slice(0, 6)})`;
          if (d.deviceId === saved) opt.selected = true;
          sel.appendChild(opt);
        });
      } catch (e) {}
    }

    async function attachConsoleInput() {
      const devId = document.getElementById('inputDevice').value;
      localStorage.setItem('butt_v3_input_dev', devId);
      if (consoleStream) {
        consoleStream.getTracks().forEach(t => t.stop());
        consoleStream = null;
      }
      if (consoleSource) {
        try { consoleSource.disconnect(); } catch (e) {}
        consoleSource = null;
      }
      try {
        const constraints = {
          audio: devId
            ? { deviceId: { exact: devId }, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            : { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        };
        consoleStream = await navigator.mediaDevices.getUserMedia(constraints);
        ensureAudioGraph();
        consoleSource = audioCtx.createMediaStreamSource(consoleStream);
        consoleSource.connect(consoleGain);
        startLevelsLoop();
        writeLog('Consola / entrada 2×1 conectada.');
      } catch (err) {
        writeLog('Sin entrada física activa (continúa sin bloqueo).');
      }
    }

    async function switchConsoleInput() {
      await attachConsoleInput();
    }

    async function togglePcSystemAudio() {
      const btn = document.getElementById('btnCapturePc');
      if (pcCaptureStream) {
        pcCaptureStream.getTracks().forEach(t => t.stop());
        pcCaptureStream = null;
        if (pcCaptureSource) {
          try { pcCaptureSource.disconnect(); } catch (e) {}
          pcCaptureSource = null;
        }
        btn.classList.remove('active');
        btn.textContent = '💻 Capturar Audio del PC';
        writeLog('Captura de audio del PC detenida.');
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
        writeLog('Tu navegador no soporta captura de audio de PC.');
        return;
      }

      try {
        pcCaptureStream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });
        const audioTracks = pcCaptureStream.getAudioTracks();
        if (!audioTracks.length) {
          writeLog('No se compartió audio del PC. Marca "Compartir audio".');
          pcCaptureStream.getTracks().forEach(t => t.stop());
          pcCaptureStream = null;
          return;
        }

        ensureAudioGraph();
        pcCaptureSource = audioCtx.createMediaStreamSource(new MediaStream(audioTracks));
        pcCaptureSource.connect(pcGain);
        startLevelsLoop();

        audioTracks[0].onended = () => {
          pcCaptureStream = null;
          btn.classList.remove('active');
          btn.textContent = '💻 Capturar Audio del PC';
          writeLog('Audio del PC desconectado.');
        };

        btn.classList.add('active');
        btn.textContent = '✅ Audio del PC Activo';
        writeLog('Audio del PC enrutado al master.');
      } catch (e) {
        writeLog('Captura de audio del PC cancelada.');
      }
    }

    function ensureAudioGraph() {
      if (!audioCtx || audioCtx.state === 'closed') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!masterGain) {
        masterGain = audioCtx.createGain();
        consoleGain = audioCtx.createGain();
        pcGain = audioCtx.createGain();

        splitter = audioCtx.createChannelSplitter(2);
        analyserL = audioCtx.createAnalyser();
        analyserR = audioCtx.createAnalyser();
        waveAnalyser = audioCtx.createAnalyser();

        analyserL.fftSize = 128;
        analyserR.fftSize = 128;
        waveAnalyser.fftSize = 256;

        consoleGain.gain.value = parseFloat(document.getElementById('consoleGainSlider').value || 1);
        pcGain.gain.value = parseFloat(document.getElementById('pcGainSlider').value || 0.85);

        consoleGain.connect(masterGain);
        pcGain.connect(masterGain);

        masterGain.connect(splitter);
        splitter.connect(analyserL, 0);
        splitter.connect(analyserR, 1);
        masterGain.connect(waveAnalyser);
      }
    }

    function hasActiveSoundSource() {
      const hasConsole = consoleStream && consoleStream.getAudioTracks().some(t => t.readyState === 'live' && t.enabled);
      const hasPc = pcCaptureStream && pcCaptureStream.getAudioTracks().some(t => t.readyState === 'live' && t.enabled);
      return Boolean(isLive || hasConsole || hasPc);
    }

    function getPeakPercent(analyserNode, buf) {
      analyserNode.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = Math.abs((buf[i] - 128) / 128);
        if (v > peak) peak = v;
      }
      return Math.min(100, Math.round(peak * 140));
    }

    function startLevelsLoop() {
      if (levelAnimId) return;
      const vuL = document.getElementById('vuLeft');
      const vuR = document.getElementById('vuRight');
      const pctL = document.getElementById('pctLeft');
      const pctR = document.getElementById('pctRight');
      const dbEl = document.getElementById('dbReadout');
      const canvas = document.getElementById('waveCanvas');
      const ctx = canvas.getContext('2d');

      const bufL = new Uint8Array(analyserL.fftSize);
      const bufR = new Uint8Array(analyserR.fftSize);
      const waveBuf = new Uint8Array(waveAnalyser.fftSize);

      function tick() {
        if (!hasActiveSoundSource()) {
          vuL.style.width = '0%';
          vuR.style.width = '0%';
          pctL.textContent = '0%';
          pctR.textContent = '0%';
          dbEl.textContent = '-∞ dB';
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(0, canvas.height / 2);
          ctx.lineTo(canvas.width, canvas.height / 2);
          ctx.stroke();
          levelAnimId = null;
          return;
        }

        const lPct = getPeakPercent(analyserL, bufL);
        const rPct = getPeakPercent(analyserR, bufR);
        const maxPct = Math.max(lPct, rPct);

        vuL.style.width = lPct + '%';
        vuR.style.width = rPct + '%';
        pctL.textContent = lPct + '%';
        pctR.textContent = rPct + '%';
        dbEl.textContent = maxPct > 1
          ? `${Math.max(-60, Math.round(20 * Math.log10(maxPct / 100)))} dB`
          : '-∞ dB';

        waveAnalyser.getByteTimeDomainData(waveBuf);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#0284c7';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const step = canvas.width / waveBuf.length;
        for (let i = 0; i < waveBuf.length; i++) {
          const y = (waveBuf[i] / 255) * canvas.height;
          if (i === 0) ctx.moveTo(0, y);
          else ctx.lineTo(i * step, y);
        }
        ctx.stroke();

        levelAnimId = requestAnimationFrame(tick);
      }

      levelAnimId = requestAnimationFrame(tick);
    }

    function startStats() {
      startTs = Date.now();
      bytesSent = 0;
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isLive) return;
        const sec = Math.floor((Date.now() - startTs) / 1000);
        const h = String(Math.floor(sec / 3600)).padStart(2, '0');
        const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('timerText').textContent = `${h}:${m}:${s}`;
        document.getElementById('bytesText').textContent = bytesSent > 1048576
          ? `${(bytesSent / 1048576).toFixed(2)} MB`
          : `${(bytesSent / 1024).toFixed(1)} KB`;
      }, 1000);
    }

    function sendMetadata() {
      const title = document.getElementById('songTitle').value.trim();
      if (!title || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ action: 'UPDATE_METADATA', title, song: title }));
      writeLog(`Título enviado: ${title}`);
    }

    function openSocket(host, port, mount, user, password, bitrate) {
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      writeLog(`Conectando a ${host}:${port}${mount}...`);
      ws = new WebSocket(RELAY_URL);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        ws.send(JSON.stringify({
          action: 'AUTH_ICECAST',
          host, port, mount, user, password, bitrate,
          contentType: 'audio/mpeg'
        }));
        clearInterval(pingTimer);
        pingTimer = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ action: 'PING' }));
          }
        }, 8000);
      };

      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          if (data.status === 'SUCCESS') {
            clearTimeout(authRetryTimer);
            beginAudioEncoding(bitrate);
          } else if (data.status === 'ERROR') {
            writeLog(`Aviso servidor: ${data.message}. Reintentando en 4s...`);
            clearTimeout(authRetryTimer);
            authRetryTimer = setTimeout(() => {
              if (isLive && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                  action: 'AUTH_ICECAST',
                  host, port, mount, user, password, bitrate,
                  contentType: 'audio/mpeg'
                }));
              }
            }, 4000);
          }
        } catch (e) {}
      };

      ws.onerror = () => {
        writeLog('Aviso de red; manteniendo audio activo...');
      };

      ws.onclose = () => {
        clearInterval(pingTimer);
        clearTimeout(authRetryTimer);
        if (isLive) {
          writeLog('Conexión interrumpida. Reconectando en tiempo real...');
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(() => {
            if (isLive) openSocket(host, port, mount, user, password, bitrate);
          }, 2500);
        }
      };
    }

    async function toggleStream() {
      if (isLive) return stopStream();

      const host = document.getElementById('host').value.trim();
      const port = document.getElementById('port').value.trim();
      let mount = document.getElementById('mount').value.trim();
      const user = document.getElementById('user').value.trim() || 'source';
      const password = document.getElementById('password').value.trim();
      const bitrate = parseInt(document.getElementById('bitrate').value, 10) || 128;

      if (!host || !port || !mount || !password) {
        alert('Completa Host, Puerto, Punto de montaje y Contraseña.');
        return;
      }
      if (!mount.startsWith('/')) mount = '/' + mount;

      isLive = true;
      document.getElementById('liveBadge').textContent = 'LIVE / ON AIR';
      document.getElementById('liveBadge').classList.add('live');
      const btn = document.getElementById('btnStream');
      btn.textContent = '⏹ DETENER TRANSMISIÓN';
      btn.classList.add('live');

      ensureAudioGraph();
      await attachConsoleInput();
      await loadDevices();
      startStats();
      startLevelsLoop();
      openSocket(host, port, mount, user, password, bitrate);
    }

    function beginAudioEncoding(bitrate) {
      if (processor) {
        try { processor.disconnect(); } catch (e) {}
        processor = null;
      }
      sendMetadata();

      if (typeof lamejs !== 'undefined') {
        mp3Encoder = new lamejs.Mp3Encoder(1, audioCtx.sampleRate, bitrate);
      }

      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (e) => {
        if (!isLive || !ws || ws.readyState !== WebSocket.OPEN || !mp3Encoder) return;
        const ch = e.inputBuffer.getChannelData(0);
        const pcm = new Int16Array(ch.length);
        for (let i = 0; i < ch.length; i++) {
          const s = Math.max(-1, Math.min(1, ch[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        }
        const mp3 = mp3Encoder.encodeBuffer(pcm);
        if (mp3.length > 0) {
          ws.send(mp3.buffer);
          bytesSent += mp3.length;
        }
      };

      masterGain.connect(processor);
      const muteOut = audioCtx.createGain();
      muteOut.gain.value = 0;
      processor.connect(muteOut);
      muteOut.connect(audioCtx.destination);

      writeLog('¡Al aire! Transmitiendo en tiempo real.');
    }

    function stopStream() {
      isLive = false;
      clearInterval(pingTimer);
      clearTimeout(authRetryTimer);
      clearTimeout(reconnectTimer);
      clearInterval(timerInterval);
      if (processor) {
        try { processor.disconnect(); } catch (e) {}
        processor = null;
      }
      if (ws) {
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      document.getElementById('liveBadge').textContent = 'IDLE / OFF';
      document.getElementById('liveBadge').classList.remove('live');
      const btn = document.getElementById('btnStream');
      btn.textContent = '▶ CONECTAR Y TRANSMITIR';
      btn.classList.remove('live');
      document.getElementById('timerText').textContent = '00:00:00';
      writeLog('Transmisión detenida.');
    }

    window.addEventListener('DOMContentLoaded', () => {
      Object.keys(DEFAULT_CFG).forEach(id => {
        const v = localStorage.getItem('butt_v3_' + id);
        const el = document.getElementById(id);
        if (el) el.value = (v !== null && v !== '') ? v : DEFAULT_CFG[id];
      });
      saveCfg();
      loadDevices();
    });
  </script>
</body>
